<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">Quadratic with irrational roots</title>
<desc id="desc">Parabola y equals x squared minus 2x minus 1, with irrational roots one minus square root two and one plus square root two, vertex one negative two.</desc>
<style>
.grid{stroke:#e2e8f0;stroke-width:1}.axis{stroke:#64748b;stroke-width:2}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}
.label{font:bold 16px Arial,sans-serif}.small{font:bold 14px Arial,sans-serif}
</style>
<rect width="920" height="520" fill="white"/>
<g>
<line x1="80" y1="80" x2="860" y2="80" class="grid"/><line x1="80" y1="140" x2="860" y2="140" class="grid"/>
<line x1="80" y1="200" x2="860" y2="200" class="grid"/><line x1="80" y1="260" x2="860" y2="260" class="grid"/>
<line x1="80" y1="320" x2="860" y2="320" class="grid"/><line x1="80" y1="380" x2="860" y2="380" class="grid"/>
<line x1="180" y1="45" x2="180" y2="455" class="grid"/><line x1="300" y1="45" x2="300" y2="455" class="grid"/>
<line x1="420" y1="45" x2="420" y2="455" class="grid"/><line x1="540" y1="45" x2="540" y2="455" class="grid"/>
<line x1="660" y1="45" x2="660" y2="455" class="grid"/><line x1="780" y1="45" x2="780" y2="455" class="grid"/>
</g>
<line x1="80" y1="260" x2="860" y2="260" class="axis"/>
<line x1="300" y1="45" x2="300" y2="455" class="axis"/>
<line x1="420" y1="45" x2="420" y2="455" class="dash"/>
<path d="M 80 80 Q 420 470 760 80" fill="none" stroke="#7c3aed" stroke-width="5"/>
<circle cx="250" cy="260" r="7" fill="#7c3aed"/><circle cx="590" cy="260" r="7" fill="#7c3aed"/>
<circle cx="420" cy="350" r="7" fill="#111827"/>
<text x="150" y="242" class="small" fill="#7c3aed">1 − √2 ≈ −0.414</text>
<text x="545" y="242" class="small" fill="#7c3aed">1 + √2 ≈ 2.414</text>
<text x="432" y="368" class="small" fill="#111827">vertex (1, −2)</text>
<rect x="535" y="90" width="290" height="106" rx="16" fill="#f5f3ff" stroke="#ddd6fe"/>
<text x="555" y="120" class="label" fill="#6d28d9">D = 8</text>
<text x="555" y="150" class="label" fill="#6d28d9">Positive, not a perfect square</text>
<text x="555" y="178" class="small" fill="#5b21b6">Use formula or complete the square</text>
<text x="875" y="266" class="label">x</text><text x="310" y="60" class="label">y</text>
</svg>