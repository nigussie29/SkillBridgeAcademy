<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">One quadratic shown in standard, factored, and vertex form</title>
<desc id="desc">Parabola y equals x squared minus 6x plus 5, with roots one and five, vertex three negative four, and axis of symmetry x equals three.</desc>
<style>
.grid{stroke:#e2e8f0;stroke-width:1}.axis{stroke:#64748b;stroke-width:2}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 7}
.label{font:bold 16px Arial,sans-serif}.small{font:bold 14px Arial,sans-serif}
</style>
<rect width="920" height="520" fill="white"/>
<g>
<line x1="80" y1="80" x2="860" y2="80" class="grid"/><line x1="80" y1="140" x2="860" y2="140" class="grid"/>
<line x1="80" y1="200" x2="860" y2="200" class="grid"/><line x1="80" y1="260" x2="860" y2="260" class="grid"/>
<line x1="80" y1="320" x2="860" y2="320" class="grid"/><line x1="80" y1="380" x2="860" y2="380" class="grid"/>
<line x1="140" y1="45" x2="140" y2="455" class="grid"/><line x1="240" y1="45" x2="240" y2="455" class="grid"/>
<line x1="340" y1="45" x2="340" y2="455" class="grid"/><line x1="440" y1="45" x2="440" y2="455" class="grid"/>
<line x1="540" y1="45" x2="540" y2="455" class="grid"/><line x1="640" y1="45" x2="640" y2="455" class="grid"/>
<line x1="740" y1="45" x2="740" y2="455" class="grid"/>
</g>
<line x1="80" y1="260" x2="860" y2="260" class="axis"/>
<line x1="140" y1="45" x2="140" y2="455" class="axis"/>
<line x1="440" y1="45" x2="440" y2="455" class="dash"/>
<path d="M 140 80 Q 440 500 740 80" fill="none" stroke="#2563eb" stroke-width="5"/>
<circle cx="240" cy="260" r="7" fill="#2563eb"/><circle cx="640" cy="260" r="7" fill="#2563eb"/>
<circle cx="440" cy="380" r="7" fill="#111827"/>
<text x="220" y="242" class="small" fill="#2563eb">root x = 1</text>
<text x="618" y="242" class="small" fill="#2563eb">root x = 5</text>
<text x="452" y="397" class="small" fill="#111827">vertex (3, −4)</text>
<text x="454" y="68" class="small" fill="#64748b">axis x = 3</text>
<rect x="510" y="95" width="330" height="118" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="530" y="124" class="label" fill="#1d4ed8">Standard: y = x² − 6x + 5</text>
<text x="530" y="154" class="label" fill="#1d4ed8">Factored: y = (x − 1)(x − 5)</text>
<text x="530" y="184" class="label" fill="#1d4ed8">Vertex: y = (x − 3)² − 4</text>
<text x="875" y="266" class="label">x</text><text x="150" y="60" class="label">y</text>
</svg>