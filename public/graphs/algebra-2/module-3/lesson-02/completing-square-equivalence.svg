<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Completing the square: standard form and vertex form</title>
<desc id="desc">The parabola y equals x squared plus 6x plus 5, equivalently y equals open parenthesis x plus 3 close parenthesis squared minus 4. Roots are negative 5 and negative 1, vertex is negative 3 negative 4.</desc>
<style>
.grid{stroke:#dbe3ee;stroke-width:1}.axis{stroke:#64748b;stroke-width:2}
.tick{font:14px Arial,sans-serif;fill:#334155}.label{font:bold 18px Arial,sans-serif}
.small{font:bold 16px Arial,sans-serif}
</style>
<rect width="900" height="520" fill="white"/>
<g class="grid">
<line x1="80" y1="35" x2="80" y2="455"/><line x1="177" y1="35" x2="177" y2="455"/>
<line x1="274" y1="35" x2="274" y2="455"/><line x1="371" y1="35" x2="371" y2="455"/>
<line x1="468" y1="35" x2="468" y2="455"/><line x1="564" y1="35" x2="564" y2="455"/>
<line x1="661" y1="35" x2="661" y2="455"/><line x1="758" y1="35" x2="758" y2="455"/>
<line x1="855" y1="35" x2="855" y2="455"/>
<line x1="80" y1="423" x2="855" y2="423"/><line x1="80" y1="358" x2="855" y2="358"/>
<line x1="80" y1="294" x2="855" y2="294"/><line x1="80" y1="229" x2="855" y2="229"/>
<line x1="80" y1="164" x2="855" y2="164"/><line x1="80" y1="100" x2="855" y2="100"/>
<line x1="80" y1="35" x2="855" y2="35"/>
</g>
<line x1="80" y1="294" x2="855" y2="294" class="axis"/><line x1="758" y1="35" x2="758" y2="455" class="axis"/>
<line x1="468" y1="35" x2="468" y2="455" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M128.4 26.9 Q467.5 818.5 806.6 26.9" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
<circle cx="274" cy="294" r="7" fill="#059669"/><circle cx="661" cy="294" r="7" fill="#059669"/><circle cx="468" cy="423" r="7" fill="#7c3aed"/>
<text x="80" y="319" class="tick">-7</text><text x="177" y="319" text-anchor="middle" class="tick">-6</text>
<text x="274" y="319" text-anchor="middle" class="tick">-5</text><text x="371" y="319" text-anchor="middle" class="tick">-4</text>
<text x="468" y="319" text-anchor="middle" class="tick">-3</text><text x="564" y="319" text-anchor="middle" class="tick">-2</text>
<text x="661" y="319" text-anchor="middle" class="tick">-1</text><text x="758" y="319" text-anchor="middle" class="tick">0</text>
<text x="66" y="428" text-anchor="end" class="tick">-4</text><text x="66" y="363" text-anchor="end" class="tick">-2</text>
<text x="66" y="299" text-anchor="end" class="tick">0</text><text x="66" y="234" text-anchor="end" class="tick">2</text>
<text x="66" y="169" text-anchor="end" class="tick">4</text><text x="66" y="105" text-anchor="end" class="tick">6</text>
<text x="66" y="40" text-anchor="end" class="tick">8</text>
<text x="250" y="276" text-anchor="end" fill="#047857" class="small">root (-5, 0)</text>
<text x="675" y="276" fill="#047857" class="small">root (-1, 0)</text>
<text x="468" y="451" text-anchor="middle" fill="#7c3aed" class="small">vertex (-3, -4)</text>
<text x="468" y="55" text-anchor="middle" fill="#64748b" class="small">x = -3</text>
<text x="628" y="88" fill="#2563eb" class="label">y = x² + 6x + 5</text>
<text x="628" y="121" fill="#2563eb" class="label">y = (x + 3)² - 4</text>
<text x="872" y="300" class="label">x</text><text x="770" y="53" class="label">y</text>
</svg>