<title id="title">Direction of quadratic functions from the sign of a</title>
<desc id="desc">Two parabolas with the same vertex at one comma two. The graph y equals open parenthesis x minus one close parenthesis squared plus two opens upward and has a minimum. The graph y equals negative open parenthesis x minus one close parenthesis squared plus two opens downward and has a maximum.</desc>
