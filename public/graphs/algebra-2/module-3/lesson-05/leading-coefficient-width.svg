<title id="title">Magnitude of a controls parabola width</title>
<desc id="desc">Three upward opening parabolas y equals one fourth x squared, y equals x squared, and y equals three x squared. All open upward because a is positive, but larger absolute values of a produce narrower graphs.</desc>
