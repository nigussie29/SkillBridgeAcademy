<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">How the discriminant controls x-axis intersections</title>
<desc id="desc">Three parabolas in the family y equals x squared minus 4x plus c. The blue graph with c equals 3 crosses the x-axis at x equals 1 and x equals 3. The green graph with c equals 4 touches the x-axis at x equals 2. The orange graph with c equals 5 remains above the x-axis and has no real roots.</desc>
