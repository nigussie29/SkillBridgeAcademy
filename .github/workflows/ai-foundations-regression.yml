name: AI Foundations source regression

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/check-ai-foundations.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-foundations-regression.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/check-ai-foundations.mjs'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ai-foundations-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check AI Foundations source contracts
        run: npm run check:ai-pathway
      - name: Verify production build
        run: npm run build
