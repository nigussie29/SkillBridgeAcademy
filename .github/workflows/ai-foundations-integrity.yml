name: AI Foundations integrity
on:
  push:
    paths:
      - 'src/pages/schools/AIFoundationsLesson*.jsx'
      - 'src/components/learning/**'
      - 'src/data/courses/aiFoundationsCourse.js'
      - 'src/services/aiLessonProgress.js'
      - 'src/App.jsx'
      - 'supabase/migrations/*ai*'
      - 'scripts/check-ai-foundations.mjs'
      - 'package.json'
      - '.github/workflows/ai-foundations-integrity.yml'
  pull_request:
    paths:
      - 'src/pages/schools/AIFoundationsLesson*.jsx'
      - 'src/components/learning/**'
      - 'src/data/courses/aiFoundationsCourse.js'
      - 'src/services/aiLessonProgress.js'
      - 'src/App.jsx'
      - 'supabase/migrations/*ai*'
      - 'scripts/check-ai-foundations.mjs'
      - 'package.json'
      - '.github/workflows/ai-foundations-integrity.yml'
permissions:
  contents: read
jobs:
  check-ai-foundations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify routes, learning components and progress contracts
        run: npm run check:ai-pathway
